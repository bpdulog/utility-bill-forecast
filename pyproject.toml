[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "utility-bill-forecast"
version = "0.1.0"
description = "Dual-fuel residential utility bill forecasting for White Plains, NY"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "tabulate>=0.9"]

[project.optional-dependencies]
web = ["streamlit>=1.30"]
test = ["pytest>=7.4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
